<title>SymNote</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: one-screen app. Desktop: notebook column | graphics column. Phone: one pane + bottom tabs. */
:root {
  --bg: #f3f5f8; --panel: #ffffff; --ink: #172033; --muted: #5e6778; --faint: #98a0ae;
  --line: #e1e5ec; --grid-minor: #eef1f5; --grid-major: #dde2ea; --axis: #3b4458;
  --accent: #2f5bea; --accent-soft: #e8eefe; --danger: #c92a2a; --region: 0.20;
  --font: "IBM Plex Sans", "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11151d; --panel: #181e29; --ink: #e6e9ef; --muted: #a2aab8; --faint: #6f7889;
  --line: #2a3242; --grid-minor: #1c2330; --grid-major: #273042; --axis: #aeb6c5;
  --accent: #7c9bff; --accent-soft: #23305a; --danger: #ff8787; --region: 0.28; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #11151d; --panel: #181e29; --ink: #e6e9ef; --muted: #a2aab8; --faint: #6f7889;
  --line: #2a3242; --grid-minor: #1c2330; --grid-major: #273042; --axis: #aeb6c5;
  --accent: #7c9bff; --accent-soft: #23305a; --danger: #ff8787; --region: 0.28; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#app { height: 100%; display: flex; flex-direction: column; }

header { display: flex; align-items: center; gap: 4px; padding-block: 7px; position: relative; z-index: 2;
  box-shadow: 0 1px 2px rgb(16 24 40 / 0.05);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 8px; margin-inline-end: 10px; }
.brand::before { content: ""; width: 24px; height: 24px; border-radius: 7px; align-self: center;
  background: linear-gradient(135deg, var(--accent), #8a5cf6); }
.brand b { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
.brand span { font-family: "IBM Plex Sans Arabic", var(--font); color: var(--accent); font-size: 17px; }
.tb { border: 1px solid transparent; background: none; border-radius: 9px; padding: 6px 10px; color: var(--ink); white-space: nowrap;
  display: inline-flex; align-items: center; gap: 7px; transition: background .12s; }
.tb:hover, .tb[aria-expanded="true"] { background: var(--accent-soft); }
.tb.ic { padding: 6px 7px; }
.tb svg, .menu svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.sep { width: 1px; height: 22px; background: var(--line); margin-inline: 4px; }
#doc { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; min-width: 0; }
#docName { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 30vw; }
#docDirty { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }
.spacer { flex: 1; }
#winbtns { display: flex; gap: 8px; margin-inline-start: 10px; }
#winbtns[hidden] { display: none; }
#winbtns button { width: 30px; height: 30px; border-radius: 50%; border: none; background: color-mix(in srgb, var(--ink) 7%, transparent); color: var(--ink); display: grid; place-items: center; padding: 0; }
#winbtns button:hover { background: color-mix(in srgb, var(--ink) 14%, transparent); }
#winbtns button[data-win=close]:hover { background: #e5484d; color: #fff; }
#winbtns svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
body.nonum .cell .gut .num { visibility: hidden; }   /* the margin stays, only the number goes */
/* drag and drop: the cell number turns into a grip on hover */
.gut { cursor: grab; touch-action: none; user-select: none; }
.gut .grip { display: none; color: var(--muted); }
.gut .grip svg { width: 16px; height: 16px; fill: currentColor; }
.cell:hover .gut .grip, .cell.dragging .gut .grip { display: block; }
.cell:hover .gut .num, .cell.dragging .gut .num { display: none; }
.cell.dragging { opacity: .55; box-shadow: 0 8px 24px rgb(0 0 0 / 0.14); }
#dropline { position: absolute; height: 3px; border-radius: 2px; background: var(--accent); pointer-events: none; z-index: 5; }
#nb { position: relative; }
#langCode { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; }

/* one column: palette, then the notebook (figures are drawn inside the cells) */
main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.cell, .adds { width: 100%; max-width: 980px; margin-inline: auto; }

/* palette */
#palette { background: var(--panel); border-bottom: 1px solid var(--line); }
#ptabs { display: flex; overflow-x: auto; scrollbar-width: none; padding-inline: 8px; }
#ptabs button { border: none; background: none; padding: 8px 10px; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
#ptabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
#pbtns { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 10px 10px; max-height: 104px; overflow-y: auto; }
#pbtns button { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 5px 11px; transition: border-color .12s, background .12s; }
#pbtns button:hover { border-color: var(--accent); background: var(--accent-soft); }
#pbtns button:active { transform: translateY(1px); }
#pbtns button.key { min-width: 44px; height: 38px; padding: 0 8px; display: inline-flex; align-items: center; justify-content: center; font-size: 15px; direction: ltr; }
#pbtns button.key.op { color: var(--accent); }
#pbtns .kgap { width: 10px; }
#pbtns.kb { direction: ltr; }   /* math keys keep their order in Arabic */

/* notebook */
#nb { flex: 1; overflow-y: auto; padding-block: 10px 80px; padding-inline: 10px; display: flex; flex-direction: column; gap: 7px; }
.cell { display: grid; grid-template-columns: 26px minmax(0, 1fr) 28px; gap: 6px; background: var(--panel);
  border: 1px solid var(--line); border-radius: 12px; padding: 8px 4px 8px 6px; box-shadow: 0 1px 2px rgb(16 24 40 / 0.04); transition: border-color .12s, box-shadow .12s; }
.cell:hover { border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); }
.cell.editing { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.gut { display: flex; flex-direction: column; align-items: center; gap: 5px; padding-top: 2px; }
.num { font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
.dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid currentColor; background: none; padding: 0; }
.dot.on { background: currentColor; }
.body { min-width: 0; min-height: 22px; display: flex; flex-direction: column; gap: 3px; cursor: text; }
.src { font-family: var(--mono); font-size: 12px; color: var(--faint); white-space: pre-wrap; word-break: break-word; }
.out { font-size: 15px; overflow-x: auto; min-height: 22px; cursor: text; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.out mjx-container { margin: 0 !important; }
.note { color: var(--muted); font-style: italic; font-size: 13px; }
.err { color: var(--danger); font-size: 13px; }
.ph { color: var(--faint); cursor: text; }
/* the notebook's text in Computer Modern, the LaTeX font, sized so formulas and words match */
@font-face { font-family: "CMU Serif"; font-weight: 400; font-style: normal; font-display: swap; src: url("fonts/cmu-serif-500-roman.woff2") format("woff2"); }
@font-face { font-family: "CMU Serif"; font-weight: 400; font-style: italic; font-display: swap; src: url("fonts/cmu-serif-500-italic.woff2") format("woff2"); }
@font-face { font-family: "CMU Serif"; font-weight: 700; font-style: normal; font-display: swap; src: url("fonts/cmu-serif-700-roman.woff2") format("woff2"); }
.txt { font-family: "CMU Serif", "Latin Modern Roman", "Times New Roman", var(--font), serif; font-size: 18px; line-height: 1.5; cursor: text; overflow-wrap: anywhere; }
.ed { width: 100%; border: none; background: transparent; outline: none; font-family: var(--mono); font-size: 15px; padding: 3px 0; }
textarea.ed { resize: vertical; min-height: 48px; line-height: 1.5; }
.slrow { display: flex; gap: 10px; align-items: center; }
.slv { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; direction: ltr; }
.edrow { display: flex; gap: 6px; align-items: start; }
.ok { border: none; background: var(--accent); color: var(--panel); border-radius: 7px; padding: 4px 10px; font-size: 13px; }
.more { border: none; background: none; color: var(--faint); border-radius: 6px; height: 26px; font-size: 18px; line-height: 1; }
.more:hover { background: var(--accent-soft); color: var(--ink); }
input[type=range] { width: 100%; accent-color: var(--accent); }
.adds { display: flex; gap: 8px; }
.adds button { border: 1px dashed color-mix(in srgb, var(--accent) 45%, var(--line)); background: none; border-radius: 10px; padding: 8px 14px; color: var(--accent); width: 100%; }
.adds button:hover { background: var(--accent-soft); border-style: solid; }

/* tables (Tableau, TableauSignes, TableauVariations) */
.ktab { position: relative; max-width: 100%; overflow-x: auto; padding: 2px 34px; align-self: center; }
.cedit { display: grid; gap: 4px; overflow-x: auto; padding-bottom: 2px; }
.csyms { display: flex; flex-wrap: wrap; gap: 4px; }
.csyms .btn { padding: 3px 9px; min-width: 34px; direction: ltr; }
.crow { display: flex; flex-direction: column; gap: 3px; padding: 6px 8px 8px; border: 1px solid var(--line); border-radius: 9px; }
.ctitle { font-size: 12px; font-weight: 600; color: var(--muted); }
#figBody .crow + .crow { margin-top: -4px; }
.vbtns [data-z=more] svg { width: 16px; height: 16px; }
.cedit input { min-width: 0; width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; background: var(--bg); font-family: var(--mono); font-size: 12px; direction: ltr; }
.cedit input.ed1 { border-color: var(--accent); background: var(--accent-soft); }
.obj input.otext { width: 100%; min-width: 0; border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; background: var(--bg); direction: ltr; }
.ktab svg.arrows { position: absolute; left: 0; top: 0; pointer-events: none; color: var(--ink); overflow: visible; }
.ktab svg.arrows line { stroke: currentColor; stroke-width: 1.1; }
table.kt.sv td.vm { height: 1.6em; }
.ktab .tset { position: absolute; top: 2px; right: 0; width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); opacity: 0; transition: opacity .12s; }
.ktab:hover .tset, .ktab .tset:focus-visible { opacity: 1; }
@media (hover: none) { .ktab .tset { opacity: .8; } }
.ktab .tset svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.7; vertical-align: middle; }
table.kt { border-collapse: collapse; font-size: calc(15px * var(--ts, 1)); direction: ltr; background: var(--panel); }
table.kt td { padding: 5px 8px; text-align: center; white-space: nowrap; border: none; }
table.kt.sv { border: 1.5px solid var(--ink); }
table.kt.sv tr + tr td { border-top: 1px solid var(--ink); }
table.kt.sv td.lab { border-right: 1.5px solid var(--ink); padding-inline: 12px; }
table.kt.sv td.pt { padding-inline: 2px; min-width: 14px; }
table.kt.sv td.iv { min-width: var(--cw, 44px); }
table.kt.sv tr td.vm, table.kt.sv tr td.vb { border-top: none; }
table.kt.sv td.vt { vertical-align: top; } table.kt.sv td.vb { vertical-align: bottom; }
table.kt.sv td.vm { padding-block: 0; }
table.kt td.dot { background: repeating-linear-gradient(to bottom, var(--ink) 0 2px, transparent 2px 5px) center / 1px 100% no-repeat; }
table.kt td.sol { background: linear-gradient(var(--ink), var(--ink)) center / 1px 100% no-repeat; }
table.kt td.dot mjx-container, table.kt td.sol mjx-container { background: var(--panel); padding-block: 2px; }
table.kt td.bar { padding: 4px 0; background: linear-gradient(to right, transparent calc(50% - 3px), var(--ink) calc(50% - 3px) calc(50% - 1.6px), transparent calc(50% - 1.6px) calc(50% + 1.6px), var(--ink) calc(50% + 1.6px) calc(50% + 3px), transparent calc(50% + 3px)); }
table.kt td.bar { min-width: 64px; }
table.kt td.bar .bv { display: flex; }
table.kt td.bar .bv span { flex: 1; min-width: 0; }
table.kt td.bar .bv span:first-child { text-align: right; padding-right: 9px; }
table.kt td.bar .bv span:last-child { text-align: left; padding-left: 9px; }
table.kt.gd.b-all td { border: 1px solid var(--ink); }
table.kt.gd.b-outer { border: 1.5px solid var(--ink); }
table.kt.gd.b-outer.hr tr:first-child td { border-bottom: 1px solid var(--ink); }
table.kt.gd td { min-width: var(--cw, 0); }
table.kt.gd.al-left td { text-align: left; } table.kt.gd.al-right td { text-align: right; }
table.kt.gd.hr tr:first-child td, table.kt.gd.hc td:first-child { background: var(--accent-soft); font-weight: 600; }

/* figures (output of Draw, Plot, Plot3D) */
.fig { position: relative; height: 340px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
.fig.fig3d { height: 400px; }
.fig canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
.vbtns { position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; }
.vbtns button { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); font-size: 15px; }
.vbtns button svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; vertical-align: middle; }
.vbtns button:hover { border-color: var(--accent); color: var(--accent); }
.vbtns.collapsed button:not([data-z=more]) { display: none; }
.vbtns [data-z=more] { line-height: 1; color: var(--muted); }
.fig.fig3d .vbtns { z-index: 3; top: 8px; left: 8px; right: auto; }
#dFig { position: fixed; inset: 70px max(16px, env(safe-area-inset-right, 0px)) auto auto; margin: 0; width: min(380px, calc(100vw - 32px));
  max-height: calc(100vh - 90px); overflow-y: auto; box-shadow: 0 16px 40px rgb(0 0 0 / 0.18); z-index: 45; }
#dFig .dlg { gap: 12px; }
#dFig h3 { margin: 4px 0 0; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.fp { display: grid; grid-template-columns: auto 1fr 1fr; gap: 6px 8px; align-items: center; }
.fp > span { font-size: 13px; color: var(--muted); }
.fp input[type=number], .fp input[type=text] { width: 100%; min-width: 0; border: 1px solid var(--line); border-radius: 7px; padding: 5px 7px; background: var(--bg); direction: ltr; }
.fp label { display: flex; gap: 6px; align-items: center; font-size: 13px; }
.objs { display: flex; flex-direction: column; gap: 6px; }
.obj { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 4px 8px; align-items: center; border: 1px solid var(--line); border-radius: 9px; padding: 6px 8px; }
.obj input[type=color] { width: 28px; height: 28px; border: none; padding: 0; background: none; border-radius: 6px; }
.obj b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: ltr; text-align: start; }
.obj .opts { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12.5px; color: var(--muted); }
.obj .opts label { display: flex; gap: 4px; align-items: center; }
.obj input[type=range] { width: 80px; }
@media (max-width: 620px) { #dFig { inset: auto 0 0 0; width: 100%; max-height: 60vh; border-radius: 14px 14px 0 0; } }
.coords { position: absolute; bottom: 6px; left: 10px; font-family: var(--mono); font-size: 11px; color: var(--muted); direction: ltr; }

/* phone */
@media (max-width: 820px) {
  .tb .lt { display: none; }
  .brand span, .brand b, #doc { display: none; }
  .fig { height: 280px; }
}

/* overlays */
#loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); z-index: 50; padding: 24px; }
#loading .box { max-width: 420px; display: flex; flex-direction: column; gap: 10px; }
#loading .bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
#loading .bar i { display: block; height: 100%; width: 30%; background: var(--accent); animation: slide 1.2s ease-in-out infinite; }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
@media (prefers-reduced-motion: reduce) { #loading .bar i { animation: none; width: 100%; } }
.menu { position: fixed; z-index: 40; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 4px;
  box-shadow: 0 8px 24px rgb(0 0 0 / 0.14); display: flex; flex-direction: column; min-width: 190px; }
.menu button, .menu label { border: none; background: none; text-align: start; padding: 7px 10px; border-radius: 7px; display: flex; gap: 10px; align-items: center; }
.menu button span { flex: 1; }
.menu kbd { font-family: var(--font); font-size: 11.5px; color: var(--faint); direction: ltr; }
.menu hr { border: none; border-top: 1px solid var(--line); margin: 4px 6px; }
.menu button:hover, .menu label:hover { background: var(--accent-soft); }
.menu input[type=color] { width: 22px; height: 22px; border: none; padding: 0; background: none; }
dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--ink); padding: 0; width: min(920px, calc(100vw - 24px)); max-height: calc(100% - 24px); }
dialog::backdrop { background: rgb(10 14 22 / 0.45); }
.dlg { display: flex; flex-direction: column; gap: 10px; padding: 16px; max-height: calc(100vh - 40px); }
.dlg h2 { margin: 0; font-size: 16px; font-weight: 600; }
.dlg textarea { width: 100%; min-height: 260px; font-family: var(--mono); font-size: 12.5px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); padding: 10px; direction: ltr; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 12px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--panel); }
.seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: none; background: none; padding: 6px 12px; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.ce { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 12px; min-height: 0; }
.ce ul { list-style: none; margin: 0; padding: 0; overflow-y: auto; max-height: 60vh; border: 1px solid var(--line); border-radius: 8px; }
.ce li button { width: 100%; text-align: start; border: none; background: none; padding: 6px 10px; }
.ce li button[aria-current="true"] { background: var(--accent-soft); color: var(--accent); }
.ce li.user button::after { content: " ●"; color: var(--accent); font-size: 10px; }
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.form label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
.form input, .form select { border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px; background: var(--bg); }
@media (max-width: 620px) { .ce { grid-template-columns: minmax(0, 1fr); } .ce ul { max-height: 120px; } }
#toast { position: fixed; bottom: calc(70px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--panel);
  padding: 8px 14px; border-radius: 8px; z-index: 60; font-size: 13px; }
</style>

<div id="app">
  <header data-tauri-drag-region>
    <div class="brand"><b>SymNote</b></div>
    <button class="tb" id="bFile" aria-haspopup="menu"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span class="lt" data-t="file"></span></button>
    <button class="tb" id="bCmd"><svg viewBox="0 0 24 24"><path d="M15 4h-2a3 3 0 0 0-3 3v11a3 3 0 0 1-3 3H6M7 11h8"/></svg><span class="lt" data-t="commands"></span></button>
    <input type="file" id="fOpen" accept=".klm,application/json" hidden>
    <div class="spacer" data-tauri-drag-region></div>
    <div id="doc" data-tauri-drag-region><span id="docName"></span><i id="docDirty" hidden></i></div>
    <div class="spacer" data-tauri-drag-region></div>
    <button class="tb ic" id="bLang" aria-haspopup="menu" aria-label="Language / Langue / اللغة" title="Language / Langue / اللغة"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg><span class="lt" id="langCode"></span></button>

function readTabPanel() {
