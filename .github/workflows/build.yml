# Builds Kalam (web core + Pyodide + Tauri) for every platform.
# Actions tab -> build -> Run workflow: builds everything, then publishes a GitHub Release
# named after the "release" field (e.g. v0.1.0; leave it empty to only attach files to the run).
# Pushing a tag like v0.2.0 does the same.
name: build

on:
  workflow_dispatch:
    inputs:
      release:
        description: Version to publish as a GitHub Release (empty = no release)
        default: v0.1.0
  push:
    tags: ['v*']

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: pip install sympy==1.14.0 && python tests/test_core.py
      - run: npx tauri build            # runs web/build.py --offline first (tauri.conf.json)
      - uses: actions/upload-artifact@v4
        with:
          name: kalam-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/dmg/*.dmg

  android:
    runs-on: ubuntu-22.04
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with:
          # default list asks for the removed 'tools' package
          packages: platform-tools ndk;27.2.12479018
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - run: npm ci
      - name: Build APK
        run: |
          export NDK_HOME="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"
          npx tauri android init --ci
          # debug build = signed with the debug key, installable directly on a phone.
          # For the Play Store, add a release keystore and use: npx tauri android build --aab
          npx tauri android build --debug --apk
      - uses: actions/upload-artifact@v4
        with:
          name: kalam-android
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  ios:
    # Needs an Apple developer account. Set the repository variable APPLE_DEVELOPMENT_TEAM (team id)
    # and the secrets APPLE_API_KEY_ID, APPLE_API_ISSUER, APPLE_API_KEY (App Store Connect .p8 content).
    if: ${{ vars.APPLE_DEVELOPMENT_TEAM != '' }}
    runs-on: macos-latest
    env:
      APPLE_DEVELOPMENT_TEAM: ${{ vars.APPLE_DEVELOPMENT_TEAM }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-apple-ios }
      - run: npm ci
      - name: Build IPA
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.APPLE_API_KEY }}" > ~/private_keys/AuthKey_${APPLE_API_KEY}.p8
          export APPLE_API_KEY_PATH=~/private_keys/AuthKey_${APPLE_API_KEY}.p8
          npx tauri ios init --ci
          npx tauri ios build --export-method debugging
      - uses: actions/upload-artifact@v4
        with:
          name: kalam-ios
          path: src-tauri/gen/apple/build/**/*.ipa

  release:
    # only for version tags; iOS is not waited for (it needs Apple signing)
    if: ${{ inputs.release != '' || startsWith(github.ref, 'refs/tags/v') }}
    needs: [desktop, android]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out }
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release || github.ref_name }}
        run: |
          # apk names are generic (app-universal-debug.apk): give it a clear name
          for f in $(find out/kalam-android -name '*.apk'); do mv "$f" "out/Kalam_${TAG#v}_android.apk"; done
          gh release create "$TAG" --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" --title "Kalam $TAG" --generate-notes \
            $(find out -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' -o -name '*.dmg' -o -name '*.apk' \))
