# Builds Kalam (web core + Pyodide + Tauri) for every platform.
# Actions tab -> build -> Run workflow: builds everything, then publishes a GitHub Release
# named after the "release" field (e.g. v0.1.0; leave it empty to only attach files to the run).
# Pushing a tag like v0.2.0 does the same.
name: build

on:
  workflow_dispatch:
    inputs:
      release:
        description: Version to publish as a GitHub Release (empty = no release)
        default: v0.1.0
  push:
    tags: ['v*']

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: pip install sympy==1.14.0 && python tests/test_core.py
      - run: npx tauri build            # runs web/build.py --offline first (tauri.conf.json)
      - uses: actions/upload-artifact@v4
        with:
          name: kalam-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/dmg/*.dmg

  android:
    runs-on: ubuntu-22.04
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with:
          # default list asks for the removed 'tools' package
          packages: platform-tools ndk;27.2.12479018
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - run: npm ci
      - name: Build APK
        env:
          # optional: a fixed key so phones accept updates (base64 of a .jks, alias "kalam")
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          export NDK_HOME="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"
          npx tauri android init --ci
          # release build (optimized) for real phones only: 64- and 32-bit ARM
          npx tauri android build --apk --target aarch64 armv7
          unsigned=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release-unsigned.apk' | head -1)
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > ks.jks; pass="$ANDROID_KEYSTORE_PASSWORD"
          else
            # no key configured: a new key each run (to update, uninstall the old app first)
            pass=kalam-ci; keytool -genkeypair -keystore ks.jks -alias kalam -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$pass" -keypass "$pass" -dname "CN=Kalam"
          fi
          bt=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          mkdir -p apk
          "$bt/zipalign" -f 4 "$unsigned" aligned.apk
          "$bt/apksigner" sign --ks ks.jks --ks-key-alias kalam --ks-pass "pass:$pass" --out apk/Kalam_android.apk aligned.apk
          ls -la apk
      - uses: actions/upload-artifact@v4
        with:
          name: kalam-android
          path: apk/*.apk

  ios:
    # Without Apple settings: unsigned .ipa (install it with Sideloadly, AltStore or TrollStore).
    # With the repository variable APPLE_DEVELOPMENT_TEAM and the secrets APPLE_API_KEY_ID,
    # APPLE_API_ISSUER, APPLE_API_KEY (App Store Connect .p8 content): signed .ipa.
    runs-on: macos-latest
    env:
      # tauri ios init requires a team id; the placeholder is unused when signing is off
      APPLE_DEVELOPMENT_TEAM: ${{ vars.APPLE_DEVELOPMENT_TEAM || 'UNSIGNED00' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-apple-ios }
      - run: brew install xcodegen || true
      - run: npm ci
      - run: npx tauri ios init --ci
      - name: Build IPA (signed)
        if: ${{ vars.APPLE_DEVELOPMENT_TEAM != '' }}
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.APPLE_API_KEY }}" > ~/private_keys/AuthKey_${APPLE_API_KEY}.p8
          export APPLE_API_KEY_PATH=~/private_keys/AuthKey_${APPLE_API_KEY}.p8
          npx tauri ios build --export-method debugging
          mkdir -p ipa && find src-tauri/gen/apple/build -name '*.ipa' -exec cp {} ipa/Kalam_ios.ipa \;
      - name: Build IPA (unsigned)
        if: ${{ vars.APPLE_DEVELOPMENT_TEAM == '' }}
        run: |
          python web/build.py --offline
          # Tauri's Xcode phase only runs inside `tauri ios build` (which signs): build the Rust lib here instead
          (cd src-tauri && cargo build --release --lib --target aarch64-apple-ios)
          cd src-tauri/gen/apple
          proj=$(ls -d *.xcodeproj | head -1)
          lib=$(grep -o 'Externals/[^";]*libapp\.a' "$proj/project.pbxproj" | head -1)
          echo "Xcode expects: $lib"
          dest=$(echo "${lib:-Externals/arm64/\$(CONFIGURATION)/libapp.a}" | sed -e 's/\$(CONFIGURATION)/release/; s/\${CONFIGURATION}/release/')
          mkdir -p "$(dirname "$dest")"
          cp ../../target/aarch64-apple-ios/release/libkalam_lib.a "$dest"
          ls -la "$dest"
          # disable the "Build Rust Code" phase (it calls `tauri ios xcode-script`)
          perl -0pi -e 's/shellScript = "(?:[^"\\]|\\.)*xcode-script(?:[^"\\]|\\.)*";/shellScript = "true";/g' "$proj/project.pbxproj"
          grep -c 'xcode-script' "$proj/project.pbxproj" || true
          scheme=$(xcodebuild -list -project "$proj" | awk '/Schemes:/{f=1;next} f&&/_iOS/{print $1; exit}')
          xcodebuild -project "$proj" -scheme "$scheme" -configuration release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          app=$(find build/Build/Products -name '*.app' -path '*iphoneos*' | head -1)
          mkdir -p Payload && cp -R "$app" Payload/
          mkdir -p "$GITHUB_WORKSPACE/ipa" && zip -qr "$GITHUB_WORKSPACE/ipa/Kalam_ios_unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: kalam-ios
          path: ipa/*.ipa

  release:
    if: ${{ !cancelled() && needs.desktop.result == 'success' && needs.android.result == 'success'
            && (inputs.release != '' || startsWith(github.ref, 'refs/tags/v')) }}
    needs: [desktop, android, ios]      # an iOS failure does not block the release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out }
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release || github.ref_name }}
        run: |
          # apk names are generic (app-universal-debug.apk): give it a clear name
          for f in $(find out/kalam-android -name '*.apk'); do mv "$f" "out/Kalam_${TAG#v}_android.apk"; done
          files=$(find out -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' -o -name '*.dmg' -o -name '*.apk' -o -name '*.ipa' \))
          # same version run again: replace the files of the existing release
          gh release create "$TAG" --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" --title "Kalam $TAG" --generate-notes $files \
            || gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber $files
